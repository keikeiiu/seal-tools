# ── Portable settings ─────────────────────────────────────────────────────────────
# The same on every machine. Anything measured on ONE machine belongs in local.yaml, not here.
#
# READ THIS BEFORE EDITING. The launcher REWRITES this whole file when you press Save on the
# Tuner, Gem or Hotkeys tab. It serialises a fixed list of keys, which means:
#   * every comment in here is lost on the next save, including any you add;
#   * any key the launcher does not know about is DROPPED, silently — this is how a spammer
#     block once disappeared, taking a player's key rotations with it. Presets are personal
#     and live in local.yaml, which is why there is no spammer section below.
#
# Documented in docs/CONFIG.md. Keys and their meaning: docs/USER_GUIDE.md.

window:
  # The window to drive. FindByTitle is a SUBSTRING match, so the whole title is not needed.
  #
  # WHEN `game.variant` IS SET BELOW, IT OVERRIDES THIS — the variant names the client and this is
  # then only the value it resolved to. To switch clients, change `game.variant`, not this.
  title: TW_LIVE

# Which game client this install is pointed at — see docs/PLAN-US-CLIENT.md.
#
# The two clients are the same game with different TEXT, and the text is what the suite matches
# against: the attribute dictionary, the per-level phrases, the feeder's time line. So a variant is
# not just a window to find; it names the words to match. That is why it is one choice and not a
# list of acceptable windows.
#
# Set `variant:` to tw or us (or to a name you add yourself, with its own dictionary file in
# config/). Leave it empty and `window.title` above stands on its own.
game:
  variant: tw
  variants:
    tw:
      title: TW_LIVE
      attributes: attributes.yaml
    us:
      title: US_LIVE
      attributes: attributes.us.yaml
reference_window:
  width: 1926
  height: 1232
arduino:
  vid: 9025
  pid:
  - 32822
  - 32823
  baud: 115200
  port: ''
hotkeys:
  start: 123
  quit: 122
  advance_grade: 71
  pause: 20
tuner:
  grade_order:
  - N
  - G
  - DG
  - XG
  - SG
  target_grade: DG
  max_retries: 999999
  save_captures: false
  ocr_retries: 3
  spring_mode: hid
  mouse_guard: stop
  guard_px: 8
  recenter_max: 20
  models:
    detector: models/ch_PP-OCRv4_det_infer.onnx
    recognizer: models/ch_PP-OCRv4_rec_infer.onnx
    classifier: models/ch_ppocr_mobile_v2.0_cls_infer.onnx
  timing:
    click_enter_delay: 0.4
    ocr_delay: 0.8
  grade_colors:
    yellow:
      rg_gap: 20
      gb_gap: 20
      r_min: 120
      g_min: 120
    blue:
      bg_gap: 25
      br_gap: 25
      b_min: 80
    red:
      rg_gap: 40
      rb_gap: 40
      r_min: 150
    purple:
      rb_gap: 30
      bg_gap: 30
      r_min: 80
      b_min: 80
    white:
      r_min: 180
      g_min: 180
      b_min: 180
    decision:
      total_min: 10
      dg_yellow: 80
      g_blue: 60
      xg_red: 60
      sg_purple: 60
      n_white: 100
      n_yellow_max: 60
      n_blue_max: 60
  filter:
    enabled: true
    match_mode: per_attr
    require_grade: DG
    rules:
    - name: 減少傷害
      count: 2
      min: 1
      max: 1
    override_rules:
    - name: 減少傷害
      count: 2
      min: 1
      max: 1
    - name: 增加傷害
      count: 3
      min: 1
      max: 1
gem:
  grades:
  - N
  - G
  - DG
  start_grade: N
  empty_mode: advance_grade_clear
  empty_streak: 2
  colored_gap_min: 40
  save_empty_captures: false
  move_mode: arduino
