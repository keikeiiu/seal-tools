window:
  title: TW_LIVE
reference_window:
  width: 1926
  height: 1232
arduino:
  vid: 9025
  pid:
  - 32822
  - 32823
  baud: 115200
  port: ''
hotkeys:
  start: 123
  quit: 122
  advance_grade: 71
  pause: 20
tuner:
  grade_order:
  - N
  - G
  - DG
  - XG
  - SG
  target_grade: DG
  max_retries: 999999
  save_captures: false
  ocr_retries: 3
  models:
    detector: models/ch_PP-OCRv4_det_infer.onnx
    recognizer: models/ch_PP-OCRv4_rec_infer.onnx
    classifier: models/ch_ppocr_mobile_v2.0_cls_infer.onnx
  timing:
    click_enter_delay: 0.4
    ocr_delay: 0.8
  grade_colors:
    yellow:
      rg_gap: 20
      gb_gap: 20
      r_min: 120
      g_min: 120
    blue:
      bg_gap: 25
      br_gap: 25
      b_min: 80
    red:
      rg_gap: 40
      rb_gap: 40
      r_min: 150
    purple:
      rb_gap: 30
      bg_gap: 30
      r_min: 80
      b_min: 80
    white:
      r_min: 180
      g_min: 180
      b_min: 180
    decision:
      total_min: 10
      dg_yellow: 80
      g_blue: 60
      xg_red: 60
      sg_purple: 60
      n_white: 100
      n_yellow_max: 60
      n_blue_max: 60
  filter:
    enabled: true
    match_mode: per_attr
    require_grade: DG
    rules:
    - name: 減少傷害
      count: 2
      min: 1
      max: 1
    override_rules:
    - name: 減少傷害
      count: 2
      min: 1
      max: 1
    - name: 增加傷害
      count: 3
      min: 1
      max: 1
gem:
  grades:
  - N
  - G
  - DG
  start_grade: N
  # tuned = send the hand-tuned gem.movements counts; arduino = place the cursor on the route's
  # destination point (closed loop). See docs/MOVE-SETS.md.
  move_mode: tuned
  empty_mode: advance_grade_clear
  empty_streak: 2
  colored_gap_min: 40
  save_empty_captures: false
spammer:
  active: default
  presets:
    default:
      '*0': 0.2
      '*1': 0.2
      '*2': 0.2
      '*3': 0.2
      '*4': 0.2
      '*5': 0.2
      '*6': 0.2
      '*7': 0.2
      '*8': 0.2
      '*9': 0.2
