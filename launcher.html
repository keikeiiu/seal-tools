<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seal Tools</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Segoe UI, sans-serif; background: #0f0f1a; color: #ccc;
         min-height: 100vh; display: flex; justify-content: center; padding: 20px 10px 40px; }
  .wrap { width: 500px; }
  h1 { text-align: center; font-size: 20px; margin-bottom: 12px; color: #fff; }
  h3 { font-size: 13px; color: #aaa; margin-bottom: 6px; }

  .tool { background: #1a1a2e; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
          display: flex; align-items: center; gap: 10px;
          border-left: 4px solid #333; transition: 0.2s; }
  .tool.active { border-left-color: #00e676; }
  .tool .icon { font-size: 22px; width: 30px; text-align: center; flex-shrink: 0; }
  .tool .info { flex: 1; min-width: 0; }
  .tool .name { font-size: 14px; font-weight: 600; color: #eee; }
  .tool .detail { font-size: 11px; color: #888; }
  .tool .status { font-size: 9px; font-weight: bold; padding: 2px 7px;
                  border-radius: 10px; flex-shrink: 0; }
  .tool .status.on { background: #00c85333; color: #00e676; }
  .tool .status.off { background: #ffffff10; color: #666; }
  .tool .btn { border: none; border-radius: 6px; padding: 6px 13px; cursor: pointer;
               font-size: 12px; font-weight: 600; min-width: 54px; text-align: center;
               transition: 0.15s; flex-shrink: 0; }
  .tool .btn.start { background: #00c853; color: #000; }
  .tool .btn.start:hover { background: #00e676; }
  .tool .btn.stop  { background: #c62828; color: #fff; }
  .tool .btn.stop:hover  { background: #ef5350; }

  .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
             padding: 14px 16px; margin-bottom: 8px; }
  .section .head { display: flex; align-items: center; gap: 8px; cursor: pointer;
                   user-select: none; }
  .section .head .arrow { font-size: 10px; color: #555; transition:0.2s; }
  .section .head .arrow.open { transform: rotate(90deg); }
  .section .body { display: none; margin-top: 10px; }
  .section .body.show { display: block; }

  label { font-size: 11px; color: #8b949e; display: block; margin-bottom: 2px; }
  input, select { width: 100%; padding: 6px 8px; border-radius: 5px;
    border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 13px; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .rule-line { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .rule-line select { flex: 1; margin-bottom: 0; }
  .rule-line input { width: 48px; margin-bottom: 0; flex-shrink: 0; }
  .rule-line .lbl { font-size: 10px; color: #8b949e; flex-shrink: 0; }
  .rule-line .mini-btn { background: #333; color: #fff; border: none; border-radius: 4px;
    padding: 3px 7px; cursor: pointer; font-size: 11px; flex-shrink: 0; }
  .btn-save { background: #1565c0; color: #fff; border: none; border-radius: 5px;
    padding: 6px 14px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn-save:hover { background: #1976d2; }
  .btn-add { background: #1a7f37; color: #fff; border: none; border-radius: 5px;
    padding: 5px 12px; cursor: pointer; font-size: 11px; }
  .btn-add:hover { background: #2ea043; }
  .btn-del { background: #c62828; color: #fff; border: none; border-radius: 4px;
    padding: 3px 7px; cursor: pointer; font-size: 11px; }
  .saved { font-size: 11px; color: #3fb950; margin-left: 8px; display: none; }
  .note { font-size: 10px; color: #8b949e; margin-top: 4px; }
  .footer { text-align: center; margin-top: 8px; font-size: 11px; color: #444; }

  .attr-table { width:100%; border-collapse:collapse; font-size:11px; margin-top:4px; }
  .attr-table td { padding:3px 6px; border-bottom:1px solid #21262d; }
  .attr-table td:first-child { color:#8b949e; width:24px; }
  .attr-table td:nth-child(2) { color:#c9d1d9; }
  .attr-table td:last-child { color:#58a6ff; text-align:right; font-weight:600; }
  .attr-box { background:#0d1117; border:1px solid #30363d; border-radius:4px;
              padding:6px 8px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Seal Tools Launcher</h1>

  <!-- Tools -->
  <div id="tools"></div>

  <!-- ===== TUNER CONFIG ===== -->
  <div class="section">
    <div class="head" onclick="toggle(this)"><span>🎯</span><h3>Tuner Config</h3><span class="arrow">▶</span></div>
    <div class="body" id="tuner-cfg">
      <div class="row">
        <div><label>Target Grade</label><select id="t-gr"><option>N</option><option>G</option><option selected>DG</option><option>XG</option><option>SG</option></select></div>
        <div><label>Max Retries</label><input type="number" id="t-mx" value="999999"></div>
      </div>
      <div class="row">
        <div><label>Click Delay (s)</label><input type="number" id="t-cl" value="0.4" step="0.1"></div>
        <div><label>OCR Delay (s)</label><input type="number" id="t-oc" value="0.8" step="0.1"></div>
      </div>
      <div class="row">
        <div><label>Match Mode</label><select id="t-mm">
          <option value="any">Any rule</option><option value="all">All rules</option><option value="per_attr" selected>Per attr</option></select></div>
        <div><label>Require Grade</label><select id="t-rq"><option selected>DG</option><option>G</option><option>N</option><option value="false">None</option></select></div>
      </div>

      <h3 style="margin-top:10px">Filter Rules</h3>
      <div id="t-rules"></div>
      <button class="btn-add" onclick="addRule()">+ Add Rule</button>
      <span class="note">max 3 (one per slot)</span>

      <h3 style="margin-top:12px">Override Rules (instant stop)</h3>
      <div id="t-ovr"></div>
      <button class="btn-add" onclick="addOvr()">+ Add Override</button>

      <div style="margin-top:10px">
        <button class="btn-save" onclick="saveTuner()">Save Tuner Config</button>
        <span class="saved" id="ts">Saved!</span>
      </div>
    </div>
  </div>

  <!-- ===== GEM CONFIG ===== -->
  <div class="section">
    <div class="head" onclick="toggle(this)"><span>💎</span><h3>Gem Composer Config</h3><span class="arrow">▶</span></div>
    <div class="body">
      <div class="row">
        <div><label>Starting Grade</label><select id="g-gr"><option selected>N</option><option>G</option><option>DG</option></select></div>
      </div>
      <button class="btn-save" onclick="saveGem()">Save</button>
      <span class="saved" id="gs">Saved!</span>
    </div>
  </div>

  <!-- ===== SPAMMER CONFIG ===== -->
  <div class="section">
    <div class="head" onclick="toggle(this)"><span>⚔️</span><h3>Skill Spammer Config</h3><span class="arrow">▶</span></div>
    <div class="body">
      <label>Per-key cooldowns — key:seconds per line (prefix * = fast press)</label>
      <textarea id="s-keys" rows="6" spellcheck="false" placeholder="F1:0.2&#10;1:5&#10;2:3"></textarea>
      <button class="btn-save" onclick="saveSpammer()">Save</button>
      <span class="saved" id="ss">Saved!</span>
    </div>
  </div>

  <div class="footer">One tool at a time &middot; Arduino shared</div>
</div>

<script>
// ── Shared ──
function toggle(h){const b=h.nextElementSibling,a=h.querySelector('.arrow');
  b.classList.toggle('show');a.classList.toggle('open')}
function flash(id){const e=document.getElementById(id);if(e){e.style.display='inline';setTimeout(()=>{if(e)e.style.display='none'},1500)}}

// ── Tools ──
function btn(label, cls, onclick) { return `<button class="btn ${cls}" onclick="${onclick}">${label}</button>` }

function attrTable(attrs){
  if(!attrs||!attrs.length)return'';
  return'<div class="attr-box"><table class="attr-table">'+
    attrs.map((a,i)=>`<tr><td>${i+1}</td><td>${a.name}</td><td>${a.value!=null?a.value:''}</td></tr>`).join('')+
    '</table></div>';
}

const TM=(id,t)=>{
  let btns='', st='';
  if (!t.loaded) {
    st='OFF'; btns=btn('Load','start',`start('${id}')`);
  } else if (t.running) {
    st='ON'; btns=btn('Stop','stop',`ctrl('${id}','stop')`)+btn('Quit','stop',`ctrl('${id}','quit')`);
  } else {
    st='IDLE'; btns=btn('Start','start',`ctrl('${id}','start')`)+btn('Quit','stop',`ctrl('${id}','quit')`);
  }
  return `<div class="tool" id="tool-${id}">
    <div class="icon">${t.icon}</div>
    <div class="info"><div class="name">${t.name}</div><div class="detail">${fmt(t)}</div>${attrTable(t.attrs)}</div>
    <div class="status ${t.loaded?'on':'off'}">${st}</div>
    ${btns}
  </div>`;
};

function fmt(t){
  let p=[];
  if(t.attempt)p.push('Att:'+t.attempt);
  if(t.grade)p.push('Grade:'+t.grade);
  if(t.count)p.push('Keys:'+t.count);
  if(t.current)p.push('Now:'+t.current);
  if(t.attrs&&t.attrs.length){
    p.push(t.attrs.map(a=>a.name+(a.value!=null?'='+a.value:'')).join(', '));
  }
  return p.join(' &middot; ')||'Idle'
}

async function start(id){await fetch('/api/start/'+id)}
async function ctrl(id, action){await fetch(`/api/control/${id}/${action}`)}
// stop all = kill process (Quit button does this via quit action then we also need to kill)
async function quit(id){await fetch(`/api/control/${id}/quit`);setTimeout(async()=>{await fetch('/api/stop')},500)}

// ── Tuner Rules Editor ──
let _rules=[], _ovr=[], _names=[];
function renderRules(){
  document.getElementById('t-rules').innerHTML=_rules.map((r,i)=>`
    <div class="rule-line">
      <select id="rn_${i}">${_names.map(n=>`<option ${r.name==n?'selected':''}>${n}</option>`).join('')}</select>
      <span class="lbl">C:</span><input type="number" id="rc_${i}" value="${r.count||1}" min="1" max="3">
      <span class="lbl">Min:</span><input type="number" id="rmin_${i}" value="${r.min||''}" placeholder="-">
      <span class="lbl">Max:</span><input type="number" id="rmax_${i}" value="${r.max||''}" placeholder="-">
      <button class="btn-del" onclick="_rules.splice(${i},1);renderRules()">X</button>
    </div>`).join('')}
function renderOvr(){
  document.getElementById('t-ovr').innerHTML=_ovr.map((r,i)=>`
    <div class="rule-line">
      <select id="ovn_${i}">${_names.map(n=>`<option ${r.name==n?'selected':''}>${n}</option>`).join('')}</select>
      <span class="lbl">C:</span><input type="number" id="ovc_${i}" value="${r.count||1}" min="1" max="3">
      <span class="lbl">Min:</span><input type="number" id="ovmin_${i}" value="${r.min||''}" placeholder="-">
      <span class="lbl">Max:</span><input type="number" id="ovmax_${i}" value="${r.max||''}" placeholder="-">
      <button class="btn-del" onclick="_ovr.splice(${i},1);renderOvr()">X</button>
    </div>`).join('')}
function addRule(){if(_rules.length<3){_rules.push({name:_names[0]||'攻擊力',count:1});renderRules()}}
function addOvr(){if(_ovr.length<3){_ovr.push({name:_names[0]||'攻擊力',count:1});renderOvr()}}

function collectRules(prefix,n){
  let out=[];
  for(let i=0;i<n;i++){
    let s=document.getElementById(prefix+'n_'+i),c=document.getElementById(prefix+'c_'+i);
    if(!s||!c)continue;
    let r={name:s.value,count:parseInt(c.value)||1};
    let mi=document.getElementById(prefix+'min_'+i),mx=document.getElementById(prefix+'max_'+i);
    if(mi&&mi.value)r.min=parseInt(mi.value);
    if(mx&&mx.value)r.max=parseInt(mx.value);
    out.push(r)
  }
  return out
}

async function saveTuner(){
  let cfg={
    target_grade:document.getElementById('t-gr').value,
    max_retries:parseInt(document.getElementById('t-mx').value)||999999,
    timing:{click_enter_delay:parseFloat(document.getElementById('t-cl').value)||0.4,
            ocr_delay:parseFloat(document.getElementById('t-oc').value)||0.8},
    filter:{enabled:true,
      match_mode:document.getElementById('t-mm').value,
      require_grade:document.getElementById('t-rq').value,
      rules:collectRules('r',_rules.length),
      override_rules:collectRules('ov',_ovr.length)}
  };
  await fetch('/api/tuner_config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
  flash('ts')
}

async function loadTuner(){
  try{_names=await(await fetch('/api/attr_names')).json()}catch(e){_names=['攻擊力']}
  try{let r=await fetch('/api/tuner_config'),c=await r.json();
    document.getElementById('t-gr').value=c.target_grade||'DG';
    document.getElementById('t-mx').value=c.max_retries||999999;
    let t=c.timing||{};
    document.getElementById('t-cl').value=t.click_enter_delay||0.4;
    document.getElementById('t-oc').value=t.ocr_delay||0.8;
    let f=c.filter||{};
    document.getElementById('t-mm').value=f.match_mode||'per_attr';
    document.getElementById('t-rq').value=f.require_grade||'DG';
    _rules=(f.rules||[]).slice();_ovr=(f.override_rules||[]).slice();
  }catch(e){}
  renderRules();renderOvr();
}

// ── Gem ──
async function saveGem(){
  await fetch('/api/gem_config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({start_grade:document.getElementById('g-gr').value})});
  flash('gs')
}
async function loadGem(){try{
  let r=await fetch('/api/gem_config'),c=await r.json();
  document.getElementById('g-gr').value=c.start_grade||'N'
}catch(e){}}

// ── Spammer ──
async function saveSpammer(){
  let lines=document.getElementById('s-keys').value.split('\n').map(l=>l.trim()).filter(Boolean);
  let keys={};
  for(let l of lines){
    let m=l.match(/^(.+?)[:：]\s*([0-9.]+)\s*$/);
    if(m) keys[m[1].trim()]=parseFloat(m[2]);
  }
  await fetch('/api/spammer_config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({keys})});
  flash('ss')
}
async function loadSpammer(){try{
  let r=await fetch('/api/spammer_config'),c=await r.json();
  document.getElementById('s-keys').value=Object.entries(c.keys||{}).map(([k,v])=>`${k}:${v}`).join('\n')
}catch(e){}}

// ── Live poll ──
function render(ts){document.getElementById('tools').innerHTML=Object.entries(ts).map(([id,t])=>TM(id,t)).join('');
  for(const[id,t]of Object.entries(ts)){let el=document.getElementById('tool-'+id);if(el)el.className='tool'+(t.loaded?' active':'')}}
async function poll(){
  try{render(await(await fetch('/api/tools')).json())}catch(e){}
  setTimeout(poll,800)
}

loadTuner();loadGem();loadSpammer();poll();
</script>
</body>
</html>
