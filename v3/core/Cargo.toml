[workspace]
resolver = "3"
members = [
    "crates/seal-proto",
    "crates/seal-core",
    "crates/seal-domain",
    "crates/seal-config",
    "crates/seal-tools",
    "crates/seal-board",
    "crates/seal-win",
    "crates/seal-ocr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: the config is opaque JSON whose map order is MEANINGFUL to at least one consumer
# (the spammer rotation walks `spammer.presets.<active>` in file order, as v2's dictionary did), and
# it keeps a hand-edited file's key order across a save. IndexMap is already in the dependency graph
# through serde_norway, so this adds no new crate to fetch.
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"

# The workspace-wide quality bar. `clippy::pedantic` is enforced on every target (lib, bins, tests,
# benches) so the code stays at the level the lint cleanup reached; narrow, reasoned `#[allow]`s in
# the source are the only exceptions. Run with `-D warnings` in the gate.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
