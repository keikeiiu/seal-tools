[workspace]
resolver = "3"
members = [
    "crates/seal-proto",
    "crates/seal-core",
    "crates/seal-domain",
    "crates/seal-config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
